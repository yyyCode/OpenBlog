server:
  port: 8083

spring:
  application:
    name: openblog-email
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/openblog?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Dubbo
dubbo:
  application:
    name: openblog-email
    logger: slf4j
  protocol:
    name: dubbo
    port: 20883
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
  scan:
    base-packages: com.yqz.openblog.email.service

# 阿里云 DirectMail
openblog:
  email:
    aliyun:
      enabled: ${EMAIL_ENABLED:false}
      access-key-id: ${ALIYUN_AK:}
      access-key-secret: ${ALIYUN_SK:}
      region-id: cn-hangzhou
      from-address: ${EMAIL_FROM:}
      from-alias: OpenBlog
