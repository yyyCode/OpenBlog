server:
  port: 8083

spring:
  application:
    name: openblog-email
  datasource:
    url: jdbc:mysql://10.21.76.221:3306/openblog?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Dubbo
dubbo:
  application:
    name: openblog-email
    logger: slf4j
  protocol:
    name: dubbo
    port: 20883
  registry:
    address: nacos://10.21.76.221:8848?username=nacos&password=nacos
    check: false
    parameters:
      namespace: public
  config-center:
    address: nacos://10.21.76.221:8848?username=nacos&password=nacos
    check: false
  scan:
    base-packages: com.yqz.openblog.email.service

# 阿里云 DirectMail
openblog:
  email:
    aliyun:
      enabled: true
      access-key-id: 你的AK
      access-key-secret: 你的SK
      region-id: cn-hangzhou
      from-address: 你的发信地址@域名
      from-alias: OpenBlog
