<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('openblog-theme')
          var dark = t === 'dark'
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <!--
      网站图标：把文件放在 frontend/public/ 下（打包后对应网站根路径 /）。
      默认使用 site-icon.png。若要用 ICO，可把图片命名为 favicon.ico 放到 public/，
      并把下面第一行 href 改为 "/favicon.ico"、type 改为 "image/x-icon"。
    -->
    <link rel="icon" href="/site-icon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/site-icon.png" />
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://fastly.jsdelivr.net" />
    <link rel="preconnect" href="https://v1.hitokoto.cn" crossorigin />
    <link rel="dns-prefetch" href="https://v1.hitokoto.cn" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBlog</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
