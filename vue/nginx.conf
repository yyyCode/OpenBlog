# 容器内 Nginx：静态资源 + 将 /api 反代到宿主机 API 网关（默认 8090，网关再转发 business 8082）。
# 依赖 docker.sh 中的 --add-host=host.docker.internal:host-gateway

map $http_user_agent $is_crawler {
    default 0;
    ~*(Baiduspider|Googlebot|bingbot|Sogou|360Spider|YisouSpider|Bytespider|DuckDuckBot|Slurp|ia_archiver|Applebot|SemrushBot|AhrefsBot) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        default_type image/svg+xml;
        access_log off;
    }

    # Sitemap and robots.txt always proxy to backend
    location = /sitemap.xml {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO: proxy crawler requests to backend for server-rendered pages
    location ~ ^/article/(\d+)$ {
        if ($is_crawler) {
            rewrite ^/article/(\d+)$ /seo/article/$1 break;
            proxy_pass http://host.docker.internal:8082;
        }
        try_files $uri /index.html;
    }

    location = / {
        if ($is_crawler) {
            rewrite ^ /seo/ break;
            proxy_pass http://host.docker.internal:8082;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
