# OpenBlog-message（统一通知服务）Docker 编排
#
# 外部依赖（MySQL/Nacos/RocketMQ）均在局域网 10.21.76.221，容器走默认 bridge 即可直达。
# 端口：
#   20883（Dubbo）—— business 容器经宿主 IP 回连，须对外可达，由宿主防火墙限制为仅内网；
#    8083（HTTP）—— 服务已无对外 HTTP 接口（原 /api/v1/message/* 的未鉴权测试发信与记录查询已移除），
#                    故仅绑本机 127.0.0.1，供宿主排障用。
# 关键：DUBBO_IP_TO_REGISTRY 指向宿主机 IP —— 使 Nacos 注册宿主机地址，
#       business 容器（不同 bridge 网络）经 10.21.76.221:20883 才能访问本服务。
# 阿里云 AK/SK/FROM 经同目录 .env（docker compose 自动加载）注入。

services:
  message:
    image: openblog-message:latest
    build:
      context: .
    container_name: openblog-message
    restart: always
    ports:
      # HTTP 只绑本机：无任何跨容器消费方（business 走 Dubbo 20883）
      - "127.0.0.1:8083:8083"
      # Dubbo 须对外可达（business 容器经宿主 IP 回连），由宿主防火墙限制为仅内网
      - "20883:20883"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xmx512M -Xms128M"
      DUBBO_IP_TO_REGISTRY: "10.21.76.221"
      ALIYUN_AK: ${ALIYUN_AK}
      ALIYUN_SK: ${ALIYUN_SK}
      ALIYUN_FROM: ${ALIYUN_FROM}
    volumes:
      # 日志文件持久化（共享 logback 落盘 /app/logs）
      - ./logs:/app/logs
    networks:
      - openblog-message-net

networks:
  openblog-message-net:
    driver: bridge
