# =============================================================================
# 端口说明（避免混淆）
# - 8082：仅 Spring Boot 后端 API（/api/v1/** 等），没有 Vue 页面，不要指望用浏览器访问 8082 得到网站首页。
# - 5173：npm run dev（Vite 开发服务器），仅本地/调试用；生产环境不要用 5173 对外提供站点。
# - 80/443：生产环境用 Nginx 托管前端 dist，并把 /api 反代到 127.0.0.1:8082。
# =============================================================================

server {
    listen 80;
    # 若用 IP 访问，可写：server_name 8.138.32.217 _;
    server_name example.com;

    root /www/wwwroot/openblog/dist;
    index index.html;

    # 浏览器会请求 /favicon.ico，而项目里可能是 favicon.jpg，避免 404/500 可二选一：
    # 1）在 public 下放 favicon.ico；或 2）如下别名到已有图标
    location = /favicon.ico {
        alias /www/wwwroot/openblog/dist/favicon.jpg;
        default_type image/jpeg;
        access_log off;
    }

    # 前端打包后若 VITE_API_BASE 为空，请求会发到同域 /api/v1/...，需反代到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue history 路由：必须回退到 index.html，否则 /、/admin/login 易 403/404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
