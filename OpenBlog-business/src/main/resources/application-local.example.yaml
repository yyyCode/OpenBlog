# 复制为 application-local.yaml 后填写本地/服务器真实连接信息（该文件已在 .gitignore 中忽略）。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/openblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: your_password
  data:
    redis:
      host: 127.0.0.1
      port: 6379

openblog:
  cache:
    # 已发布文章正文 Redis TTL（分钟），可按需覆盖
    article-published-ttl-minutes: 30
  search:
    enabled: false
    uris: "http://localhost:9200"
    # username: elastic
    # password: changeme
    index-prefix: "openblog_"
  auth-security:
    slider:
      enabled: false
      ttl-seconds: 300
    login-lockout:
      enabled: false
  jwt:
    secret: "REPLACE_WITH_LONG_RANDOM_AT_LEAST_32_CHARS"
  storage:
    # local：读写本机目录；minio：读写远程 MinIO（与生产共用 endpoint 即可在本地看到线上图片）
    type: minio
    root-path: "./uploads"
    public-base-url: "http://localhost:8082"
    thumb-long-edge: 320
    minio:
      endpoint: "http://127.0.0.1:9000"
      access-key: "your_minio_access_key"
      secret-key: "your_minio_secret_key"
      bucket: "openblog"
