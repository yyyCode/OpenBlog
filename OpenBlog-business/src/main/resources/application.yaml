# 反向代理后需正确解析客户端 IP 时可配合 Nginx 传递 X-Forwarded-*，并启用下方 forward-headers-strategy。
server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: openblog-business
  datasource:
    url: jdbc:mysql://10.21.76.221:3306/openblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: 12345678aa
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      # 阅读量滑动窗口、登录锁、文章正文缓存等；正文缓存读/写失败时自动仅走 MySQL。
      # 阅读量/站点访问的滑动窗口去重依赖 Redis；连不上时应用会降级为直接写 MySQL（无去重）。
      # 若 26739 连接失败，请检查：本机/服务器防火墙、云安全组、Redis 是否监听 0.0.0.0、地址与端口是否正确。
      host: 10.21.76.221
      port: 6739
      # 若 Redis 设置了 requirepass，在此填写密码
      # password: your_redis_password
      timeout: 3s
      password: 12345678aa
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# Dubbo consumer
dubbo:
  application:
    name: openblog-business
    logger: slf4j
  registry:
    address: nacos://10.21.76.221:8848?username=nacos&password=nacos
    check: false
    parameters:
      namespace: public
  config-center:
    address: nacos://10.21.76.221:8848?username=nacos&password=nacos
    check: false
  consumer:
    check: false

audit:
  enabled: true
  async: true
  channel: local

openblog:
  seo:
    site-url: "https://www.wecode.xin"
    site-name: "OpenBlog"
    site-description: "WeCode 技术博客"
    baidu-push-enabled: false
    baidu-push-token: ""
  cache:
    # 已发布文章正文（Redis）；不可用或异常时自动仅查 MySQL
    article-published-ttl-minutes: 30
    # 已发布文章列表页（Redis）；变更时通过版本号全局失效，短 TTL 兜底
    article-list-ttl-minutes: 5
  search:
    # 是否启用 ES 全文搜索（需先安装 ES 并创建索引）。默认 false，不影响启动。
    enabled: false
    # ES 集群地址，逗号分隔
    uris: "http://localhost:9200"
    # ES 用户名（可选，X-Pack Security 开启时填写）
    # username: elastic
    # ES 密码（可选）
    # password: changeme
    # 索引名前缀，实际索引名 = 前缀 + 业务名（如 openblog_articles）
    index-prefix: "openblog_"
  site:
    version: "1.0.0"
  # 生产环境请改为前端实际域名，例如 https://blog.example.com
  cors:
    allowed-origin-patterns:
      - "https://www.wecode.xin"
      - "http://localhost:5173"
      - "http://localhost"
  auth-security:
    slider:
      enabled: false
      ttl-seconds: 300
    login-lockout:
      enabled: false
      max-failures-per-ip: 5
      failure-window-seconds: 300
      lockout-seconds: 900
    email-code:
      code-ttl-seconds: 300
      resend-cooldown-seconds: 60
      max-verify-attempts: 5
  jwt:
    secret: ${OPENBLOG_JWT_SECRET:openblog-jwt-secret-key-please-change-me-0123456789abcdef}
    issuer: openblog
    access-token-expire-seconds: 7200
    refresh-token-expire-seconds: 2592000
  storage:
    # 存储类型：local（本地磁盘）| minio（对象存储，本地与服务器共用同一 MinIO 即可访问相同图片）
    type: minio
    root-path: "/www/wwwroot/java/uploads/"
    # 浏览器可访问的站点根（含 https 与域名），勿写内网 IP:8082，否则 HTTPS 页会混合内容拦截图片
    public-base-url: "https://www.wecode.xin"
    thumb-long-edge: 320
    # 当 type=minio 时填写以下配置
    minio:
      endpoint: "http://10.21.76.221:9000"
      access-key: minio
      secret-key: admin123
      bucket: "openblog-document"
