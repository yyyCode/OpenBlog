# 反向代理后需正确解析客户端 IP 时可配合 Nginx 传递 X-Forwarded-*，并启用下方 forward-headers-strategy。
server:
  port: 8082
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://10.21.32.85:3307/openblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: admin123
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      # 阅读量滑动窗口、登录锁、文章正文缓存等；正文缓存读/写失败时自动仅走 MySQL。
      # 阅读量/站点访问的滑动窗口去重依赖 Redis；连不上时应用会降级为直接写 MySQL（无去重）。
      # 若 26739 连接失败，请检查：本机/服务器防火墙、云安全组、Redis 是否监听 0.0.0.0、地址与端口是否正确。
      host: 10.21.32.85
      port: 6379
      # 若 Redis 设置了 requirepass，在此填写密码
      # password: your_redis_password
      timeout: 3s
      password: admin123

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openblog:
  cache:
    # 已发布文章正文（Redis）；不可用或异常时自动仅查 MySQL
    article-published-ttl-minutes: 30
  site:
    version: "1.0.0"
  # 生产环境请改为前端实际域名，例如 https://blog.example.com
  cors:
    allowed-origin-patterns:
      - "*"
  auth-security:
    slider:
      enabled: false
      ttl-seconds: 300
    login-lockout:
      enabled: false
      max-failures-per-ip: 5
      failure-window-seconds: 300
      lockout-seconds: 900
  jwt:
    secret: "PLEASE_CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32_PLUS_CHARS"
    issuer: openblog
    access-token-expire-seconds: 900
    refresh-token-expire-seconds: 2592000
  storage:
    # 存储类型：local（本地磁盘）| minio（对象存储，本地与服务器共用同一 MinIO 即可访问相同图片）
    type: minio
    root-path: "/www/wwwroot/java/uploads/"
    # 浏览器可访问的站点根（含 https 与域名），勿写内网 IP:8082，否则 HTTPS 页会混合内容拦截图片
    public-base-url: "https://www.wecode.xin"
    thumb-long-edge: 320
    # 当 type=minio 时填写以下配置
    minio:
      endpoint: "http://10.21.32.85:9000"
      access-key: "zoRKQFmL5UjnYz5HNrbh"
      secret-key: "3T8kopnAh4mQVLSDDgqQpxH3oSn8jhH5H0wzKlzE"
      bucket: "openblog-document"
