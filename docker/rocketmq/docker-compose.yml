# RocketMQ 4.9.7 单机部署（通知异步投递 P1 使用）
# 在局域网机器（如 10.21.76.221）执行：docker compose up -d
# 注意：broker.conf 的 brokerIP1 必须改成该机器的局域网 IP，否则跨机 producer/consumer 连不上 broker。
services:
  namesrv:
    image: apache/rocketmq:4.9.7
    container_name: rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"           # nameserver，business 的 rocketmq.name-server 指向这里
    command: sh mqnamesrv
    networks: [rmq]

  broker:
    image: apache/rocketmq:4.9.7
    container_name: rocketmq-broker
    restart: unless-stopped
    depends_on: [namesrv]
    ports:
      - "10911:10911"         # 主端口（producer/consumer 走这里）
      - "10909:10909"         # VIP channel（生产端建议关闭，见 JAVA_OPTS）
      - "10912:10912"         # HA
    environment:
      - NAMESRV_ADDR=namesrv:9876
    volumes:
      - ./broker.conf:/opt/rocketmq-4.9.7/conf/broker.conf
    command: sh mqbroker -c /opt/rocketmq-4.9.7/conf/broker.conf
    networks: [rmq]

  # 可选：管理台（查看 topic / 消息 / 死信）
  console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-console
    restart: unless-stopped
    depends_on: [namesrv]
    ports:
      - "8088:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    networks: [rmq]

networks:
  rmq:
