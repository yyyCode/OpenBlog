# OpenBlog：push 到 master 时编译后端、打包前端，并将静态资源与 Docker 相关文件同步到阿里云，在服务器执行 docker.sh 更新 Nginx 容器。
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   SERVER_SSH_KEY      服务器 SSH 私钥（完整 PEM）
#   SERVER_REMOTE_HOST  公网 IP 或域名
#   SERVER_REMOTE_USER  SSH 登录用户（如 root 或 deploy）
#   SERVER_TARGET       服务器上部署目录绝对路径（如 /opt/openblog/web），该目录下会有 dist、Dockerfile、docker.sh、nginx.conf
#
# 后端 Spring Boot 需在**同一台机器宿主机**上监听 8082（java -jar 或 systemd），容器内 Nginx 通过 host.docker.internal 反代到宿主机。
# 前端容器默认映射宿主机端口 18088 → 容器 80，访问 http://IP:18088/ ，请在安全组放行 TCP 18088。
name: Build and deploy OpenBlog

on:
  push:
    branches:
      - master
      - web-refactor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 消除 “Node.js 20 actions are deprecated” 警告：让基于 JS 的 action 在 Node 24 上跑
    # 见 https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build backend (Maven)
        run: mvn -B -ntp package -DskipTests -pl OpenBlog-business -am

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vue/package-lock.json

      - name: Install frontend dependencies and build
        working-directory: vue
        run: |
          npm ci
          npm run build

      - name: Prepare release bundle for server
        run: |
          mkdir -p release
          cp -r vue/dist release/dist
          cp vue/Dockerfile vue/docker.sh vue/nginx.conf release/

      # 在 GitHub Runner 构建镜像并导出，避免国内服务器直连 Docker Hub 拉取 nginx:alpine 超时
      - name: Build Docker image on runner
        run: |
          docker build -t openblog-web release/
          docker save openblog-web | gzip > release/openblog-web.tar.gz

      - name: Deploy files to server
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc --delete --exclude=dist/.user.ini"
          SOURCE: "release/dist release/Dockerfile release/docker.sh release/nginx.conf release/openblog-web.tar.gz"
          REMOTE_HOST: ${{ secrets.SERVER_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_REMOTE_USER }}
          TARGET: ${{ secrets.SERVER_TARGET }}
          SCRIPT_BEFORE: ls -la

      - name: Run Docker commands on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_REMOTE_HOST }}
          username: ${{ secrets.SERVER_REMOTE_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.SERVER_TARGET }}
            sh docker.sh
