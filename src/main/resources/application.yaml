server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://8.138.32.217:3306/openblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: 12345678aa
  jpa:
    # 显式指定方言，避免在 JDBC 元数据不可用时启动失败
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: 8.138.32.217
      port: 26379
      # 默认超时（避免 Redis 卡住导致接口变慢）
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openblog:
  site:
    # 侧栏展示的站点版本（与业务数据独立，可自行随发版修改）
    version: "1.0.0"
  # 全站按 IP 滑动窗口限流（依赖 Redis；单机部署可调大窗口与次数）
  rate-limit:
    enabled: true
    window-ms: 60000
    max-requests: 120
  jwt:
    secret: "PLEASE_CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32_PLUS_CHARS"
    issuer: openblog
    access-token-expire-seconds: 900
    refresh-token-expire-seconds: 2592000
  storage:
    # 本地存储目录（相对工作目录）
    root-path: "/www/wwwroot/java/uploads/"
    # 生成 URL 使用（例如 http://localhost:8082）
    public-base-url: "http://8.138.32.217:8082"
    thumb-long-edge: 320