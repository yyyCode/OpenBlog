# 敏感信息请用环境变量或 application-local.yaml（勿提交）覆盖，勿将真实密码提交仓库。
# 反向代理后需正确解析客户端 IP 时可配合 Nginx 传递 X-Forwarded-*，并启用下方 forward-headers-strategy。
server:
  port: 8082
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/openblog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openblog:
  site:
    version: "1.0.0"
  # 生产环境请改为前端实际域名，例如 https://blog.example.com
  cors:
    allowed-origin-patterns:
      - "*"
  rate-limit:
    enabled: true
    window-ms: 60000
    max-requests: 120
    auth:
      enabled: true
      window-ms: 60000
      max-requests: 20
  auth-security:
    slider:
      enabled: true
      ttl-seconds: 300
    login-lockout:
      enabled: true
      max-failures-per-ip: 5
      failure-window-seconds: 300
      lockout-seconds: 900
  jwt:
    secret: ${OPENBLOG_JWT_SECRET:OpenBlogDevDefaultSecretKey32Bytes!!}
    issuer: openblog
    access-token-expire-seconds: 900
    refresh-token-expire-seconds: 2592000
  storage:
    root-path: ${OPENBLOG_STORAGE_ROOT_PATH:./uploads}
    public-base-url: ${OPENBLOG_STORAGE_PUBLIC_BASE_URL:http://localhost:8082}
    thumb-long-edge: 320
